[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safellm"
version = "0.1.0"
description = "Research infrastructure for adversarial-prompt detection and evidence-grounded verification"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
safellm = "safellm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
